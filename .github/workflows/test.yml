name: Test

on:
  push:
    branches: [main]
  # Every pull request, so one stacked on another's branch is tested too.
  pull_request:

jobs:
  bats:
    name: Bats (${{ matrix.os }}, umask ${{ matrix.umask }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        umask: ['022', '002']
    steps:
      - uses: actions/checkout@v4

      # bats runs its tests with the first bash on PATH. macOS's own is
      # 3.2, where a failing [[ ]] that is not a test's last line does not
      # fail the test; Homebrew's is put first so every assertion counts.
      # Scripts whose shebang is /bin/bash still run under 3.2, as on a Mac.
      - name: Install bats + stow (macOS)
        if: runner.os == 'macOS'
        run: brew install bash bats-core stow

      - name: Install bats + stow (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bats stow

      - name: Run bats tests with umask ${{ matrix.umask }}
        run: |
          umask ${{ matrix.umask }}
          bash --version | head -n 1
          bats tests/bats/

      - name: Run the grafter scripts
        run: |
          set -e
          for t in tests/grafter/test-*.sh; do bash "$t"; done

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck on shell scripts
        run: |
          # Lint scripts but don't fail on warnings (yet); just report.
          shopt -s globstar nullglob
          shellcheck --severity=error \
            bin/eden bin/eden-* install.sh get-eden.sh lib/*.sh \
            packages/eden/.eden/libexec/grafters/graft-*
